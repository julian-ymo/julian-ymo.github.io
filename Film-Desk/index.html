<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0B0B0C">
<meta name="description" content="Film Desk — Fujifilm-style photo editor: 20 film simulations, Q menu, pro tools, curves, crop, recipes and export. Runs in your browser; photos never leave your device.">
<title>Film Desk</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Material Icons by Google, Apache License 2.0 — subset to the icons Film Desk uses. */
@font-face { font-family: 'Material Icons'; font-style: normal; font-weight: 400; font-display: block; src: url(material-icons.woff) format('woff'); }
:root {
  --bg: #0B0B0C; --panel: #111214; --surface: #17181A; --surface2: #222326; --line: #2E3034;
  --text: #F1F0EC; --muted: #A3A39E; --amber: #F2A33A; --amber-light: #FFC06A; --on-amber: #1A1206; --amber-dim: #2A2113;
  --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; overflow: hidden; overscroll-behavior: none; }
body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; }
input, textarea { font: inherit; color: var(--text); }
.material-icons { font-family: "Material Icons"; font-weight: normal; font-style: normal; letter-spacing: normal; text-transform: none; white-space: nowrap; word-wrap: normal; direction: ltr; -webkit-font-feature-settings: "liga"; font-feature-settings: "liga"; -webkit-font-smoothing: antialiased; font-size: 22px; line-height: 1; user-select: none; display: inline-block; width: 1em; overflow: hidden; vertical-align: middle; }
#app { position: relative; width: 100%; height: 100%; overflow: hidden; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: #000; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.amber { color: var(--amber); }
.label { color: var(--muted); font-size: 10px; font-family: var(--mono); letter-spacing: 1.5px; text-transform: uppercase; }
.row { display: flex; align-items: center; }
.grow { flex: 1; min-width: 0; }
.scroll-y { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.scroll-x { overflow-x: auto; scrollbar-width: none; overscroll-behavior-x: contain; }
.scroll-x::-webkit-scrollbar { display: none; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: var(--text); flex: none; }
.icon-btn:hover:not(:disabled) { background: rgba(255,255,255,.06); }
.icon-btn:disabled { color: var(--line); }
.icon-btn.sm { width: 36px; height: 36px; }
.icon-btn.sm .material-icons { font-size: 20px; }
.text-btn { padding: 8px 12px; border-radius: 20px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.text-btn:hover:not(:disabled) { background: rgba(255,255,255,.06); }
.pill { padding: 7px 12px; border-radius: 999px; font-size: 12px; white-space: nowrap; color: var(--text); border: 1px solid transparent; flex: none; }
.pill.on { background: var(--text); color: var(--bg); font-weight: 600; }
.pill.outline { border-color: var(--line); }
.pill.outline.on { border-color: var(--text); }
.btn { height: 48px; border-radius: 999px; padding: 0 22px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--amber); color: var(--on-amber); }
.btn.outline { border: 1px solid var(--line); color: var(--text); font-weight: 500; }
.btn:disabled { opacity: .55; }
.spinner { width: 28px; height: 28px; border: 3px solid rgba(242,163,58,.25); border-top-color: var(--amber); border-radius: 50%; animation: spin .8s linear infinite; }
.spinner.sm { width: 14px; height: 14px; border-width: 2px; }
@keyframes spin { to { transform: rotate(360deg); } }
.badge { background: rgba(11,11,12,.8); color: var(--text); font: 11px var(--mono); padding: 4px 8px; border-radius: 6px; pointer-events: none; }

/* ---------------- studio ---------------- */
.studio-head { padding: 12px 12px 6px 16px; gap: 4px; }
.studio-head h1 { margin: 0; font-size: 22px; font-weight: 700; }
.fab { width: 38px; height: 38px; border-radius: 50%; background: var(--amber); color: var(--on-amber); display: flex; align-items: center; justify-content: center; }
.filters { gap: 18px; padding: 0 16px 8px; }
.filters button { font-size: 13px; color: var(--muted); padding: 4px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.filters button::after { content: ''; width: 18px; height: 2px; background: transparent; }
.filters button.on { color: var(--text); font-weight: 600; }
.filters button.on::after { background: var(--text); }
.grid { display: grid; gap: 2px; grid-template-columns: repeat(3, 1fr); padding-bottom: 24px; }
@media (min-width: 600px) { .grid { grid-template-columns: repeat(5, 1fr); } }
@media (min-width: 840px) { .grid { grid-template-columns: repeat(6, 1fr); } }
.cell { position: relative; aspect-ratio: 1; background: transparent; cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.cell .inner { position: absolute; inset: 0; background: var(--surface); overflow: hidden; }
.cell img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.cell.sel { background: var(--amber-dim); }
.cell.sel .inner { inset: 10px; border-radius: 6px; }
.cell.pasted .inner { outline: 2px solid var(--amber); outline-offset: -2px; }
.cell .code { position: absolute; left: 4px; bottom: 4px; background: rgba(0,0,0,.4); color: #fff; font: 700 9px var(--mono); padding: 1px 4px; border-radius: 3px; }
.cell .check { position: absolute; top: 5px; right: 5px; width: 24px; height: 24px; border-radius: 50%; background: rgba(0,0,0,.25); border: 2px solid rgba(241,240,236,.85); display: flex; align-items: center; justify-content: center; color: var(--on-amber); }
.cell.sel .check { background: var(--amber); border-color: var(--amber); }
.cell .check .material-icons { font-size: 18px; }
.cell .copied { position: absolute; top: 5px; left: 5px; background: var(--amber); color: var(--on-amber); font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px; }
.sel-bar { height: 56px; background: var(--surface); padding: 0 4px; }
.sel-bar .title { font-size: 18px; font-weight: 600; }
.actions { display: flex; background: var(--surface); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
.actions button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; padding: 6px 0; color: var(--text); }
.actions button:disabled { color: var(--line); }
.actions button.hi { color: var(--amber); font-weight: 600; }
.clip-banner { margin: 0 12px 8px; padding: 10px 12px; border-radius: 10px; background: var(--amber-dim); gap: 10px; }
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px; gap: 10px; }
.empty h2 { margin: 0; font-size: 18px; font-weight: 600; }
.empty p { margin: 0 0 8px; color: var(--muted); max-width: 360px; line-height: 1.45; }
.drop-hint { position: absolute; inset: 12px; border: 2px dashed var(--amber); border-radius: 16px; background: rgba(42,33,19,.7); display: none; align-items: center; justify-content: center; font-size: 18px; color: var(--amber); z-index: 30; pointer-events: none; }
.dragging-files .drop-hint { display: flex; }
.progress { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 6px; }
.progress div { height: 100%; width: 40%; background: var(--amber); animation: indet 1.2s ease-in-out infinite; }
@keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

/* ---------------- editor ---------------- */
.ed { flex-direction: row; }
.ed-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ed-side { flex: none; display: flex; flex-direction: column; background: var(--bg); }
.topbar { height: 48px; flex: none; padding: 0 2px; }
.topbar .icon-btn { width: 40px; height: 40px; }
.topbar .export { color: var(--amber); font-weight: 600; font-size: 15px; padding: 8px 12px; }
.topbar .export:disabled { color: var(--muted); }
.preview { position: relative; flex: 1; min-height: 0; background: #000; display: flex; align-items: center; justify-content: center; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.preview canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
.preview .orig { position: absolute; inset: 0; display: none; }
.preview.showing-orig .orig { display: block; }
.preview .simtag { position: absolute; left: 12px; top: 8px; font: 10px var(--mono); letter-spacing: 1px; color: rgba(241,240,236,.85); pointer-events: none; text-shadow: 0 0 4px rgba(0,0,0,.6); }
.preview .busy { position: absolute; right: 12px; top: 12px; }
.preview .center { position: absolute; }
.preview .bottom-badge { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); }
.preview.picking { cursor: crosshair; }
.tabs { height: 54px; flex: none; display: flex; background: #000; }
.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; color: rgba(163,163,158,.6); }
.tabs button .material-icons { font-size: 20px; }
.tabs button.on { color: var(--text); font-weight: 600; }
.bottom { flex: none; display: flex; flex-direction: column; justify-content: flex-end; background: var(--bg); overflow: hidden; }
.panel-scroll { overflow-y: auto; overscroll-behavior: contain; flex: 1 1 auto; min-height: 0; }
.sec-head { padding: 2px 16px; min-height: 34px; }
.dial-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); row-gap: 10px; padding: 0 8px 10px; }
.dial { display: flex; flex-direction: column; align-items: center; width: 64px; margin: 0 auto; }
.dial .circle { width: 50px; height: 50px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; text-align: center; font: 700 11px/10px var(--mono); color: var(--text); white-space: pre-line; overflow: hidden; }
.dial.changed .circle { border-color: rgba(242,163,58,.7); color: var(--amber); }
.dial.dimmed .circle { border-color: var(--line); color: rgba(163,163,158,.6); }
.dial.selected .circle { border: 2px solid var(--text); }
.dial .lbl { margin-top: 4px; font-size: 10px; color: var(--muted); max-width: 64px; }
.dial.selected .lbl { color: var(--text); }
.tool { display: flex; flex-direction: column; align-items: center; width: 64px; margin: 0 auto; }
.tool .circle { position: relative; width: 46px; height: 46px; margin: 2px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; }
.tool .dot { position: absolute; top: -1px; right: -1px; width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }
.tool .lbl { margin-top: 3px; font-size: 10px; color: var(--muted); }
.tool .val { font: 10px var(--mono); color: var(--muted); }
.tool.changed .val { color: var(--amber); }
.sim-strip { display: flex; gap: 6px; padding: 0 12px; }
.sim-tile { flex: none; width: 62px; display: flex; flex-direction: column; align-items: center; }
.sim-tile .img { width: 62px; height: 62px; position: relative; overflow: hidden; }
.sim-tile canvas, .sim-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sim-tile.on .img { outline: 2px solid #fff; outline-offset: -2px; }
.sim-tile.on .img canvas, .sim-tile.on .img img { padding: 2px; }
.sim-tile .bar { width: 100%; height: 3px; }
.sim-tile .code { margin-top: 4px; font: 10px var(--mono); color: var(--muted); }
.sim-tile.on .code { color: #fff; font-weight: 700; }
.opt { display: flex; flex-direction: column; background: var(--bg); min-height: 0; max-height: 100%; }
.opt-body { overflow-y: auto; overscroll-behavior: contain; padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.opt-bar { height: 48px; flex: none; border-top: .5px solid var(--line); }
.opt-bar .hint { color: rgba(163,163,158,.7); font-size: 11px; }
.big { display: flex; flex-direction: column; align-items: center; }
.big .t { color: var(--muted); font: 11px var(--mono); letter-spacing: 2px; text-transform: uppercase; text-align: center; }
.big .v { font: 600 22px var(--mono); padding: 0 6px; min-height: 36px; display: flex; align-items: center; }
.big .v.changed { color: var(--amber); }
.big .icon-btn { width: 36px; height: 36px; color: var(--muted); }
.tick { width: 100%; }
.tick canvas { width: 100%; height: 40px; display: block; touch-action: pan-y; cursor: ew-resize; }
.tick canvas:focus-visible { outline: 1px solid var(--amber); border-radius: 6px; }
.tick .ends { display: flex; padding: 0 6px; font: 10px var(--mono); color: var(--muted); }
.tick .ends span { flex: 1; }
.tick .ends span:nth-child(2) { text-align: center; }
.tick .ends span:nth-child(3) { text-align: right; }
.tiles { display: flex; justify-content: center; }
.pictile { width: 68px; flex: none; display: flex; flex-direction: column; align-items: center; }
.pictile .box { width: 54px; height: 54px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
.pictile .box canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.pictile .box span { position: relative; font: 700 12px var(--mono); color: var(--muted); }
.pictile.on .box { border: 2px solid #fff; }
.pictile.on .box span { color: var(--text); }
.pictile .lbl { margin-top: 4px; font-size: 10px; color: var(--muted); text-align: center; white-space: pre-line; line-height: 12px; }
.pictile.on .lbl { color: var(--text); }
.lock { gap: 6px; color: var(--muted); font-size: 12px; }
.lock .material-icons { font-size: 14px; }
.qbox-wrap { display: flex; flex-direction: column; padding-top: 4px; }
.qbox-pointer { width: 100%; height: 11px; display: block; margin-bottom: -1.5px; position: relative; z-index: 1; }
.qbox { background: #17140E; border: 1.5px solid var(--amber); border-radius: 14px; padding: 10px 14px 2px; display: flex; flex-direction: column; gap: 6px; }
.qbox .tiles { justify-content: flex-start; }
.shiftpad { touch-action: none; display: block; margin: 0 auto; cursor: crosshair; }
.slider-row .row { padding: 0 4px; font-size: 12px; }
.swatches { display: flex; justify-content: space-between; }
.swatch { width: 34px; height: 34px; border-radius: 50%; padding: 4px; border: 2px solid transparent; }
.swatch div { width: 100%; height: 100%; border-radius: 50%; }
.swatch.edited { border-color: var(--amber); }
.swatch.on { border-color: #fff; }
.menu { position: fixed; z-index: 60; background: var(--surface2); border-radius: 6px; padding: 8px 0; min-width: 200px; box-shadow: 0 8px 28px rgba(0,0,0,.5); }
.menu button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 16px; text-align: left; font-size: 14px; }
.menu button:hover:not(:disabled) { background: rgba(255,255,255,.06); }
.menu button:disabled { color: var(--muted); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; }
.scrim.clear { background: transparent; }
.scrim.sheet-scrim { align-items: flex-end; }
.dialog { background: var(--surface); border-radius: 24px; padding: 24px; width: min(420px, calc(100% - 48px)); display: flex; flex-direction: column; gap: 16px; }
.dialog h3 { margin: 0; font-size: 22px; font-weight: 400; }
.dialog .btns { display: flex; justify-content: flex-end; gap: 8px; }
.dialog .btns button { padding: 10px 14px; border-radius: 20px; font-weight: 500; }
.field { width: 100%; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; font-size: 15px; outline: none; }
.field:focus { border-color: var(--amber); }
textarea.field { min-height: 120px; resize: vertical; font: 12px var(--mono); }
.sheet { background: var(--surface); width: min(640px, 100%); border-radius: 22px 22px 0 0; max-height: 90%; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }
.sheet .grip { width: 32px; height: 4px; border-radius: 2px; background: var(--line); margin: 10px auto 6px; flex: none; }
.check-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; cursor: pointer; }
.cbox { width: 20px; height: 20px; border-radius: 3px; border: 2px solid var(--muted); display: flex; align-items: center; justify-content: center; flex: none; }
.cbox.on { background: var(--amber); border-color: var(--amber); color: var(--on-amber); }
.cbox .material-icons { font-size: 16px; }
.toast { position: absolute; left: 50%; bottom: 88px; transform: translateX(-50%); z-index: 70; background: #313033; color: #F4EFF4; border-radius: 4px; padding: 6px 8px 6px 16px; min-height: 48px; display: flex; align-items: center; gap: 8px; font-size: 14px; width: max-content; max-width: min(560px, calc(100% - 24px)); box-shadow: 0 4px 16px rgba(0,0,0,.4); }
.toast button { color: var(--amber-light); font-weight: 600; padding: 8px 10px; }

/* ---------------- curve ---------------- */
.graph { position: relative; background: #1C1D20; }
.graph canvas { position: absolute; inset: 10px; width: calc(100% - 20px); height: calc(100% - 20px); touch-action: none; }
.graph .glabel { position: absolute; left: 12px; top: 6px; font: 10px var(--mono); color: #8E8D88; pointer-events: none; z-index: 1; }
.graph .glabel.amber { color: var(--amber); }
.chbtn { width: 30px; height: 30px; margin-left: 4px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; border: 1.5px solid transparent; }
.chbtn.edited { border-color: var(--amber); }
.thin { display: flex; align-items: center; height: 36px; }
.thin .lbl { width: 72px; color: var(--muted); font-size: 12px; flex: none; }
.thin canvas { flex: 1; min-width: 0; height: 32px; touch-action: pan-y; cursor: ew-resize; }
.numbox { width: 46px; height: 26px; margin-left: 8px; border-radius: 4px; background: #0E0E10; border: 1px solid var(--line); text-align: center; font: 12px var(--mono); outline: none; flex: none; }
.numbox.changed { color: var(--amber); }
.numbox:focus { border-color: var(--amber); }

/* ---------------- crop ---------------- */
.cropview { position: relative; flex: 1; min-height: 0; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; touch-action: none; }
.cropview .stage { position: relative; }
.cropview .stage .clip { position: absolute; inset: 0; overflow: hidden; }
.cropview .stage .clip canvas.photo { position: absolute; inset: 0; width: 100%; height: 100%; }
.cropview .stage canvas.overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
.cropview .top-badge { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); }
.cropview .bl-badge { position: absolute; bottom: 10px; left: 10px; }
.ruler { width: 100%; height: 40px; display: block; touch-action: pan-y; cursor: ew-resize; }
.guides { display: flex; gap: 4px; }
.guide { width: 54px; flex: none; display: flex; flex-direction: column; align-items: center; border-radius: 8px; padding: 2px 0; }
.guide canvas { width: 38px; height: 28px; border-radius: 3px; display: block; }
.guide span { font-size: 10px; color: var(--muted); margin-top: 3px; }
.guide.on span { color: var(--text); }
.tools5 { display: flex; justify-content: space-between; }
.tools5 button { display: flex; align-items: center; gap: 4px; padding: 8px 6px; border-radius: 8px; font-size: 12px; }
.tools5 button .material-icons { font-size: 18px; }
.tools5 button.on { color: var(--amber); }

/* ---------------- recipes / export ---------------- */
.page-head { padding: 8px 8px 0 4px; }
.page-head h1 { margin: 0; font-size: 24px; font-weight: 700; }
.card { background: var(--surface); border-radius: 14px; width: 100%; max-width: 720px; }
.recipe { padding: 10px; gap: 12px; cursor: pointer; }
.recipe .thumb { width: 76px; height: 76px; border-radius: 10px; overflow: hidden; flex: none; }
.recipe .thumb canvas, .recipe .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.recipe .name { font-size: 15px; font-weight: 600; }
.recipe .sum { font: 10px/14px var(--mono); color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.list { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 16px 24px; }
.setrow { height: 52px; padding: 0 16px; border-bottom: .5px solid rgba(46,48,52,.6); width: 100%; max-width: 720px; cursor: pointer; }
.setrow .v { color: var(--muted); font-size: 13px; max-width: 220px; margin-right: 6px; }
.setrow.disabled { color: var(--muted); cursor: default; }
.export-wrap { width: 100%; max-width: 720px; padding: 8px 16px; }
.summary-thumb { width: 96px; height: 72px; border-radius: 6px; overflow: hidden; background: var(--surface); flex: none; }
.summary-thumb canvas, .summary-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { flex: 1; padding: 9px 4px; font-size: 13px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--amber-dim); color: var(--amber); font-weight: 600; }
.switch { width: 52px; height: 32px; border-radius: 16px; background: var(--surface2); border: 2px solid var(--line); position: relative; flex: none; transition: background .15s; }
.switch::after { content: ''; position: absolute; top: 6px; left: 6px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: all .15s; }
.switch.on { background: var(--amber); border-color: var(--amber); }
.switch.on::after { left: 22px; top: 2px; width: 24px; height: 24px; background: var(--on-amber); }
.note { color: var(--muted); font-size: 12px; line-height: 1.45; }
.posgrid { display: grid; grid-template-columns: repeat(3, 22px); gap: 4px; }
.posgrid button { width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--line); }
.posgrid button.on { background: var(--amber); border-color: var(--amber); }
.numfield { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 6px; padding: 0 10px; height: 44px; }
.numfield input { width: 100%; background: transparent; border: 0; outline: none; font-size: 15px; }
.numfield:focus-within { border-color: var(--amber); }
.save-bar { padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); gap: 10px; background: #000; }
.wm-preview { position: relative; width: 100%; max-width: 360px; align-self: center; border-radius: 6px; overflow: hidden; background: var(--surface); }
.wm-preview canvas { display: block; width: 100%; }
.footer-note { color: var(--muted); font-size: 11px; text-align: center; padding: 6px 16px 18px; line-height: 1.5; }
.footer-note a { color: var(--muted); }
</style>
